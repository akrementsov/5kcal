server {
    listen 80;
    server_name pay.5kcal.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pay.5kcal.app;

    ssl_certificate /etc/letsencrypt/live/pay.5kcal.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.5kcal.app/privkey.pem;

    # Переменная в proxy_pass заставляет nginx резолвить имя bot на каждый
    # запрос (с кешем valid=10s), а не один раз при старте — иначе после
    # пересоздания контейнера бота nginx бьёт в старый IP и отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /robokassa/ {
        set $bot_upstream bot;
        proxy_pass http://$bot_upstream:9090;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name app.5kcal.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.5kcal.app;

    ssl_certificate /etc/letsencrypt/live/app.5kcal.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.5kcal.app/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Всё содержимое домена живёт в боте под /webapp/:
    # / -> bot:9090/webapp/ (index), /assets/* -> /webapp/assets/*, /api/* -> /webapp/api/*
    # При proxy_pass с переменной nginx не подставляет остаток пути сам,
    # поэтому префикс /webapp добавляется явным rewrite.
    location / {
        set $bot_upstream bot;
        rewrite ^ /webapp$uri break;
        proxy_pass http://$bot_upstream:9090;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
}

