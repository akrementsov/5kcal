# Базовые настройки
port 6379
protected-mode yes

# Настройки производительности
maxmemory 256mb
maxmemory-policy allkeys-lru

# Настройки персистентности
save 900 1
save 300 10
save 60 10000

# Логирование
loglevel notice

# Дополнительные настройки безопасности
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command EVAL ""
