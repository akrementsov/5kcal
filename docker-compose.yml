services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fivekcal-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:${METRICS_PORT:-9090}:9090"
    stop_grace_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "project=fivekcal"
    networks:
      - fivekcal-network

  redis:
    image: redis:7.2
    container_name: fivekcal-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --logfile ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "project=fivekcal"
    networks:
      - fivekcal-network

  postgres:
    image: postgres:16
    container_name: fivekcal-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "project=fivekcal"
    networks:
      - fivekcal-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: fivekcal-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9091}:9090"
    depends_on:
      - bot
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - "project=fivekcal"
    networks:
      - fivekcal-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: fivekcal-alertmanager
    restart: unless-stopped
    # В образе нет envsubst, а telegram_configs не умеет env-переменные —
    # подставляем токен/chat_id из .env через sed при старте
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        sed -e "s|__ALERT_BOT_TOKEN__|$$ALERT_BOT_TOKEN|"
        -e "s|__ALERT_CHAT_ID__|$$ALERT_CHAT_ID|"
        /etc/alertmanager/alertmanager.tpl.yml > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager
    env_file:
      - .env
    volumes:
      - ./config/alertmanager/alertmanager.tpl.yml:/etc/alertmanager/alertmanager.tpl.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - "project=fivekcal"
    networks:
      - fivekcal-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: fivekcal-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - "project=fivekcal"
    networks:
      - fivekcal-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: fivekcal-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Для Postgres-датасорса (рейтинг токенов по пользователям)
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_HOST_PORT:-3001}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - "project=fivekcal"
    networks:
      - fivekcal-network

  nginx:
    image: nginx:alpine
    container_name: fivekcal-nginx
    restart: unless-stopped
    # Раз в 6ч reload — подхватит обновлённые сертификаты Let's Encrypt
    command: /bin/sh -c "while :; do sleep 21600; nginx -s reload; done & exec nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - bot
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - "project=fivekcal"
    networks:
      - fivekcal-network

  certbot:
    image: certbot/certbot
    container_name: fivekcal-certbot
    restart: unless-stopped
    # Раз в 12ч certbot renew — Let's Encrypt обновит сертификаты в окне 30 дней до истечения
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 43200; done"
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    labels:
      - "project=fivekcal"

  dozzle:
    image: amir20/dozzle:latest
    container_name: fivekcal-dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${DOZZLE_HOST_PORT:-8888}:8080"
    restart: unless-stopped
    labels:
      - "project=fivekcal"
    networks:
      - fivekcal-network

networks:
  fivekcal-network:
    name: fivekcal-network
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  certbot_data:
  certbot_www:
